version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dropship_db
    environment:
      POSTGRES_USER: dropship_user
      POSTGRES_PASSWORD: dropship_password
      POSTGRES_DB: dropship_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropship_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dropship_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dropship_api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://dropship_user:dropship_password@postgres:5432/dropship_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_change_me
      STRIPE_KEY: your_stripe_key
      STRIPE_SECRET: your_stripe_secret
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dropship_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: dropship_network
